# yowat · Cloudflare Pages 配置
# 部署前必读：DEPLOY.md

name = "yowat"
compatibility_date = "2026-11-01"

# 站点根目录就是当前目录（index.html 在这一层）
pages_build_output_dir = "."

# ---------------- D1 数据库 ----------------
# database_id 需要用 `npx wrangler d1 create yowat-db` 生成后填进来
[[d1_databases]]
binding = "DB"
database_name = "yowat-db"
database_id = "450ce2d1-8507-47b4-93d6-7428c26963ac"

# ---------------- 环境变量（明文） ----------------
# 注意：一旦这里出现 [vars]，Cloudflare Dashboard 就只能添加 Secret
# （加密变量），明文变量一律由本文件管理。这正好是我们要的分工：
#   GITHUB_TOKEN  → 密钥，在 Dashboard 里加成 Secret，不进仓库
#   GITHUB_REPO   → 只是仓库名，不敏感，写在这里
[vars]
GITHUB_REPO = "liequi/yowat"
GITHUB_BRANCH = "main"

# ---------------- 可选：以后视频放 R2 ----------------
# 目前视频按静态资源跟着 Pages 一起部署（免费，单文件 ≤ 25MB）。
# 如果视频变大变多，再开通 R2（10GB 存储 + 出站流量免费），取消下面注释：
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "yowat-video"

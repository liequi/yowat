# 服务器端转码：把上传页收到的原片转成 360p / 240p / 封面，再部署上线
#
# 为什么不在浏览器里转：ffmpeg.wasm 0.11 在 3 分钟级别的真实文件上会抛
# `RuntimeError: function signature mismatch`（wasm 里直接崩，进度永远 0%），
# 0.12 的 core 又是 31MB，部分网络下拉不下来。服务器上跑原生 ffmpeg，
# 3 分钟视频 8 秒就转完，用户上传完可以直接关页面。
#
# 触发链：
#   用户上传 → /api/upload 把原片分块提交到 _raw/ → push（这条路被 deploy.yml 忽略）
#   → 本工作流：node tools/transcode-ci.mjs 拼回 + 转码 → 提交 videos/{id}/ + 删 _raw
#   → 部署 → 播放页读接口 HEAD 探到文件存在，状态从 processing 自动翻成 ready
#
# 注意：本工作流用 GITHUB_TOKEN push，GitHub 不会再触发其他 workflow，
# 所以部署必须在本 job 里自己跑一次 wrangler。

name: Transcode

on:
  push:
    branches: [main]
    paths:
      - "_raw/**"
  # 手动补跑：Actions 页面点 Run workflow
  workflow_dispatch:

# 转码结果要 push 回仓库
permissions:
  contents: write

# 连着传两个视频时排队跑，别互相抢 ref
concurrency:
  group: transcode
  cancel-in-progress: false

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 确认 ffmpeg
        # 缺 ffprobe 的话整条流水线都读不出视频尺寸，这里先看清楚
        run: |
          which ffmpeg ffprobe
          ffmpeg -version  | head -1
          ffprobe -version | head -1

      - name: 拼原片并转码
        # 逻辑全在 Node 脚本里：bash 出错时从 Actions 日志看不出是哪条命令挂的，
        # 而且这个脚本本地就能原样跑一遍验证。
        #
        # set -o pipefail 不能少：`node ... | tee` 的退出码是 tee 的，
        # 没有它 node 崩了这一步照样显示成功（2026-11-26 就这么被瞒过一次）。
        # 日志同时写进 _ci/last-run.md，由下面的提交步骤一起推上去 ——
        # GitHub 的 Actions 日志接口要仓库写权限，我们读不到。
        run: |
          set -o pipefail
          mkdir -p _ci
          node tools/transcode-ci.mjs 2>&1 | tee _ci/last-run.md

      - name: 提交转码结果
        # 一个批次里可能有一个成功一个失败：成功的也要提交上去，
        # 所以这里不能挂在 success() 上。
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "yowat-bot"
          git config user.email "yowat-bot@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
            exit 0
          fi

          git commit -m "自动转码：生成 360p / 240p / 封面并清理 _raw"
          for i in 1 2 3; do
            if git push; then break; fi
            echo "push 失败（远端可能刚被推过），重试第 $i 次"
            sleep 5
            git pull --rebase --autostash || true
          done

      - name: 部署到 Cloudflare Pages
        # 一批里只要有一个转码成功就得部署，所以不挂在 success() 上
        if: always()
        run: npx --yes wrangler@4 pages deploy . --project-name yowat --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true

      - name: 结果
        run: echo "转码并部署完成 → https://yowat.pages.dev"
